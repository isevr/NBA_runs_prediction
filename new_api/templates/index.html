<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Selection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #333;
        }
        .button-container {
            margin-top: 20px;
        }
        .button-upload {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            border: none;
            border-radius: 5px;
            color: rgb(196, 47, 47);
        }
        .button-train {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            border: none;
            border-radius: 5px;
            color: rgb(47, 122, 196);
        }
        .button-seqmin {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            border: none;
            border-radius: 5px;
            color: rgb(73, 122, 62);
        }
        .button-opt {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            border: none;
            border-radius: 5px;
            color: rgb(182, 98, 100);
        }
    </style>
</head>
<body>
    <h1>Choose an Option</h1>
    <div class="button-container">
        <button class="button button-upload" onclick="window.location.href='/upload'">Upload Data</button>
        <button class="button button-train" onclick="window.location.href='/model_train'">Train Model</button>
        <button class="button button-seqmin" onclick="window.location.href='/sequence_mining'">Sequence Mining</button>
        <button class="button button-opt" onclick="window.location.href='/optimization'">Sequence Optimization</button>
    </div>
</body>
</html>
